aid: 4d-molecular-therapeutics-4dmt
name: 4D Molecular Therapeutics (4DMT)
description: >-
  4D Molecular Therapeutics (4DMT) is a late-stage clinical biotechnology company headquartered in
  Emeryville, California, developing genetic medicines for large-market diseases. The company uses a
  proprietary directed-evolution platform it calls Therapeutic Vector Evolution to invent customized,
  proprietary adeno-associated virus (AAV) gene delivery vectors that carry therapeutic payloads to
  specific tissue types. Its pipeline targets retinal and pulmonary disease, led by 4D-150 for wet
  age-related macular degeneration and diabetic macular edema, and 4D-710 for cystic fibrosis lung
  disease. 4DMT is a therapeutics developer rather than a software vendor: it publishes no public API,
  developer portal, SDK, or machine-readable API contract of any kind.
